<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="top-bar">
    <h3 id="target-url">postMessage Tracker</h3>
    <div class="top-bar-actions">
      <button id="btn-export" class="icon-btn" title="Export JSON">Export</button>
      <button id="btn-clear" class="icon-btn" title="Clear data">Clear</button>
      <button id="btn-theme" class="icon-btn" title="Toggle theme">Theme</button>
    </div>
  </div>

  <div class="tab-nav">
    <button class="tab-btn active" data-tab="listeners">
      Listeners <span id="count-listeners" class="count">0</span>
    </button>
    <button class="tab-btn" data-tab="messages">
      Messages <span id="count-messages" class="count">0</span>
    </button>
    <button class="tab-btn" data-tab="senders">
      Senders <span id="count-senders" class="count">0</span>
    </button>
    <button class="tab-btn" data-tab="poc">PoC</button>
  </div>

  <div id="stats-bar" class="stats-bar" style="display:none;"></div>

  <!-- Listeners tab -->
  <div id="tab-listeners" class="tab-view active">
    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="Search domain, code, stack..." />
      <div class="pill-group" title="Filter by pattern confidence (not confirmed severity)">
        <button class="pill active" data-filter="all">All</button>
        <button class="pill" data-filter="critical" title="Critical-risk pattern — needs validation">Crit</button>
        <button class="pill" data-filter="high" title="High-risk pattern — needs validation">High</button>
        <button class="pill" data-filter="medium" title="Medium-risk pattern — needs validation">Med</button>
      </div>
    </div>
    <div class="tab-content" id="listeners-list"></div>
  </div>

  <!-- Messages tab -->
  <div id="tab-messages" class="tab-view">
    <div class="filter-bar">
      <input type="text" id="msg-search-input" placeholder="Search origin, data..." />
    </div>
    <div class="tab-content" id="messages-list"></div>
  </div>

  <!-- Senders tab -->
  <div id="tab-senders" class="tab-view">
    <div class="filter-bar">
      <input type="text" id="sender-search-input" placeholder="Search target origin, data..." />
    </div>
    <div class="tab-content" id="senders-list"></div>
  </div>

  <!-- PoC Tester tab -->
  <div id="tab-poc" class="tab-view">
    <div class="tab-content">
      <div class="poc-form">
        <div class="poc-field">
          <label for="poc-origin">Target Origin</label>
          <input type="text" id="poc-origin" value="*" placeholder="* or https://target.com" />
        </div>
        <div class="poc-field">
          <label for="poc-payload">Payload (JSON or text)</label>
          <textarea id="poc-payload" placeholder='{"type": "test", "action": "ping"}'></textarea>
        </div>
        <button id="btn-send-poc" class="btn-primary">Send postMessage</button>
        <div id="poc-status"></div>

        <div style="margin-top: 16px; border-top: 1px solid var(--overlay); padding-top: 12px;">
          <div class="poc-field">
            <label>Quick Harness</label>
            <button id="btn-harness" class="btn-primary" style="background: var(--overlay); color: var(--text);">
              Copy Exploit Harness HTML
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="analyzer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
